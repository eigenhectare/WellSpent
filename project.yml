name: WellSpent

options:
  bundleIdPrefix: com.drewreilly.wellspent
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  minimumXcodeGenVersion: 2.45.4

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_TEAM: 68LEY459MW
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1

targets:
  WellSpent:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WellSpentApp
    dependencies:
      - target: WellSpentShared
        embed: false
      - target: WellSpentWidgets
    info:
      path: WellSpentApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: WellSpent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UIApplicationSupportsIndirectInputEvents: true
        WellSpentPrivacyPolicyURL: "https://wellspent-holdings.github.io/privacy/"
        WellSpentSourceCodeURL: "https://github.com/eigenhectare/WellSpent"
        WellSpentSupportURL: "https://wellspent-holdings.github.io/support/"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.drewreilly.wellspent.completion
            CFBundleURLSchemes:
              - wellspent
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.drewreilly.wellspent
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WellSpentApp/Resources/WellSpent.entitlements
        ENABLE_DEBUG_DYLIB: false
        GENERATE_INFOPLIST_FILE: false
        OTHER_LDFLAGS:
          - $(inherited)
          - -all_load

  WellSpentShared:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WellSpentShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewreilly.wellspent.shared
        PRODUCT_NAME: WellSpentShared
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: true

  WellSpentWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WellSpentWidgets
    dependencies:
      - target: WellSpentShared
    info:
      path: WellSpentWidgets/Info.plist
      properties:
        CFBundleDisplayName: WellSpent Activity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewreilly.wellspent.widgets
        PRODUCT_NAME: WellSpentWidgets
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WellSpentWidgets/WellSpentWidgets.entitlements
        GENERATE_INFOPLIST_FILE: false
        OTHER_LDFLAGS:
          - $(inherited)
          - -all_load
        SKIP_INSTALL: true

  WellSpentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WellSpentTests
    dependencies:
      - target: WellSpent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewreilly.wellspent.tests
        GENERATE_INFOPLIST_FILE: true

  WellSpentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WellSpentUITests
    dependencies:
      - target: WellSpent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewreilly.wellspent.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: WellSpent

schemes:
  WellSpent:
    build:
      targets:
        WellSpent: all
        WellSpentTests: [test]
        WellSpentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: WellSpentTests
          parallelizable: false
        - name: WellSpentUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  WellSpentWidgets:
    build:
      targets:
        WellSpentWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
