name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks

      - name: Install pinned project generator and search tool
        run: |
          scripts/install-pinned-xcodegen.sh "${RUNNER_TEMP}/wellspent-xcodegen"
          echo "${RUNNER_TEMP}/wellspent-xcodegen/bin" >> "${GITHUB_PATH}"
          brew install ripgrep

      - name: Resolve Watch simulator
        env:
          CI_WATCH_SIMULATOR_NAME: Apple Watch Series 11 (46mm)
          CI_WATCH_SIMULATOR_OS: "26.5"
        run: |
          set -euo pipefail
          runtime_suffix="watchOS-${CI_WATCH_SIMULATOR_OS//./-}"
          watch_id="$(xcrun simctl list devices available --json | jq -er \
            --arg name "${CI_WATCH_SIMULATOR_NAME}" \
            --arg runtime_suffix "${runtime_suffix}" '
              [
                .devices
                | to_entries[]
                | select(.key | endswith($runtime_suffix))
                | .value[]
                | select(.isAvailable and .name == $name)
                | .udid
              ]
              | unique
              | if length == 1 then .[0]
                else error("expected exactly one matching Watch simulator")
                end
            ')"
          printf 'CI_WATCH_SIMULATOR_DESTINATION=platform=watchOS Simulator,id=%s\n' \
            "${watch_id}" >> "${GITHUB_ENV}"

      - name: Run secrets-free pipeline
        env:
          CI_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.5
        run: scripts/ci.sh
